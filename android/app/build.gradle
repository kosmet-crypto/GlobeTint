plugins {
    id 'com.android.application'
}

// The web app lives at the repo root; copy it into the APK so it works offline.
def webRoot = rootProject.file('..')
tasks.register('copyWebApp', Copy) {
    from(webRoot) {
        include 'index.html', 'data/**', 'vendor/**', 'fonts/**'
    }
    into 'src/main/assets/www'
}
preBuild.dependsOn copyWebApp

android {
    namespace 'com.kosmet.travelmap'
    compileSdk 35

    defaultConfig {
        // Neutral id: stays the same whatever the app is finally called on Google Play.
        applicationId 'com.kosmet.travelmap'
        minSdk 26
        targetSdk 34  // 35 forces edge-to-edge; the page does not pad for system bars in a WebView
        // CI passes the run number so each new APK installs over the previous one.
        def runNumber = System.getenv('GITHUB_RUN_NUMBER')
        def build = runNumber ? (runNumber as int) : 1
        versionCode build
        versionName "1.0.${build}"
        // Fingerprint of the native part from CI; a newer release with the same one only has web changes.
        buildConfigField 'String', 'NATIVE_HASH', "\"${System.getenv('NATIVE_HASH') ?: ''}\""
        // Where the app looks for newer pages and APKs (this repo's main branch and GitHub Releases).
        buildConfigField 'String', 'UPDATE_REPO', "\"${System.getenv('GITHUB_REPOSITORY') ?: 'kosmet-crypto/GlobeTint'}\""
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can update the installed app.
        // Fine for sideloading; use a private key (GitHub secret) before publishing to Google Play.
        release {
            storeFile file('globetint.keystore')
            storePassword 'globetint'
            keyAlias 'globetint'
            keyPassword 'globetint'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
