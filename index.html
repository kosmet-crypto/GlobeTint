<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="globetint-native-api" content="1">
<title>GlobeTint</title>
<style>
@font-face{font-family:Manrope;font-weight:200 800;font-display:swap;src:url(fonts/manrope-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Manrope;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Manrope;font-weight:200 800;font-display:swap;src:url(fonts/manrope-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --v1:#A9D1FF;--v2:#5FA8F5;--v3:#2F7BE0;--v4:#1D4FA3;--lived:#22B573;--wish:#FF7F6B;--accent:#2F7BE0;
  --hero1:#4C8DF0;--hero2:#2254B8;--hero3:#16336F;
  --bg:#F4F6FA;--card:#FFFFFF;--ink:#11151C;--muted:#6B7382;--line:#E7EAF0;--land:#DDE2EA;--stroke:#FFFFFF;--chip:#EEF1F6;
  --shadow:0 1px 2px rgba(17,21,28,.04),0 8px 24px rgba(17,21,28,.06);--scrim:rgba(10,14,22,.45);
  --nav:72px;--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-palette="rose"]{
  --v1:#FBD0DF;--v2:#F7A8C3;--v3:#F07FA6;--v4:#E65A8D;--lived:#D2336A;--wish:#F0A030;--accent:#D2336A;
  --hero1:#F584AA;--hero2:#E0457C;--hero3:#B82A5E;
}
:root[data-palette="violet"]{
  --v1:#CBBDF6;--v2:#A993EC;--v3:#8468DB;--v4:#6447C2;--lived:#331E7A;--wish:#F0A030;--accent:#6E56CF;
  --hero1:#9A85F0;--hero2:#5B3FC0;--hero3:#2C1A6E;
}
/* Rose and violet: one hue, home is the strongest shade. On a dark background the strongest
   shade is the brightest (a dark one would disappear), so more visits glow brighter. */
:root[data-theme="dark"][data-palette="rose"]{
  --v1:#7E3558;--v2:#A8467A;--v3:#CF5E97;--v4:#EE86B6;--lived:#FFC6DE;--accent:#E86FA5;
}
:root[data-theme="dark"][data-palette="violet"]{
  --v1:#43377D;--v2:#5D4BAE;--v3:#7F6BDD;--v4:#A594F5;--lived:#DCD3FF;--accent:#9D8AF2;
}
:root[data-theme="dark"]{
  --bg:#0C1017;--card:#161B25;--ink:#F2F4F8;--muted:#8A93A5;--line:#232A37;--land:#283040;--stroke:#0C1017;--chip:#1E2430;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;user-select:none;-webkit-user-select:none}
input,select,textarea,button{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,textarea{user-select:text;-webkit-user-select:text}

#app-globetint{position:fixed;inset:0;display:flex;flex-direction:column}
main{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;display:none;flex-direction:column}
.tab.on{display:flex}
.scroll{flex:1;overflow-y:auto;padding-bottom:110px;-webkit-overflow-scrolling:touch}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px 10px;padding-top:max(14px,env(safe-area-inset-top))}
.brand{font-size:22px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.brand .dot{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,var(--v2),var(--v4),var(--lived),var(--wish),var(--v2))}
.h1{font-size:26px;font-weight:800;letter-spacing:-.6px}
.btns{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.chips{display:flex;gap:8px;padding:0 20px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}

/* map */
.mapwrap{flex:1;position:relative;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#map path{vector-effect:non-scaling-stroke;stroke-linejoin:round}
#map .lands path{fill:var(--land);stroke:var(--stroke);stroke-width:.6}
#map .lands path.v1{fill:var(--v1)}#map .lands path.v2{fill:var(--v2)}#map .lands path.v3{fill:var(--v3)}#map .lands path.v4{fill:var(--v4)}
#map .lands path.lv{fill:var(--lived)}#map .lands path.ws{fill:var(--wish)}
#map .lands path.dim{opacity:.35}
#map .lands path.sel{stroke:var(--ink);stroke-width:2}
#map .sphere{fill:var(--card);stroke:var(--line);stroke-width:1}
#map .grat{fill:none;stroke:var(--line);stroke-width:.5}
#map .glow{fill:url(#gshade);pointer-events:none}
#map .dots circle.d{stroke:var(--stroke);stroke-width:1;fill:var(--land)}
#map .dots circle.d.v1{fill:var(--v1)}#map .dots circle.d.v2{fill:var(--v2)}#map .dots circle.d.v3{fill:var(--v3)}#map .dots circle.d.v4{fill:var(--v4)}
#map .dots circle.d.lv{fill:var(--lived)}#map .dots circle.d.ws{fill:var(--wish)}
#map .dots circle.d.none{fill:var(--land);stroke:var(--muted);stroke-opacity:.5}
#map .dots g.hide{display:none}
#map .dots circle.hit{fill:transparent}
#map .dots g.dim{opacity:.35}

.panel{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgba(17,21,28,.10);padding:8px 20px 16px;z-index:3}
:root[data-theme="dark"] .panel{box-shadow:none;border-top:1px solid var(--line)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.grabzone{margin:-8px -20px 0;padding:8px 20px 0}
.big{display:flex;align-items:flex-end;justify-content:space-between}
.big .n{font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.big .n small{font-size:19px;color:var(--muted);font-weight:700;letter-spacing:0}
.big .pct{font-size:13px;color:var(--muted);font-weight:600;text-align:right}
.big .pct b{display:block;font-size:26px;color:var(--accent);font-weight:800;letter-spacing:-.5px}
.lbl{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.legend{display:flex;gap:14px;margin:12px 0 2px;font-size:12px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.ramp{display:flex;gap:2px}.ramp i{width:7px}
.bars{display:grid;gap:9px;margin-top:12px}
.bar{display:grid;grid-template-columns:86px 1fr 50px;align-items:center;gap:10px;font-size:13px;font-weight:600}
.bar .t{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--v2),var(--v3))}
.bar em{font-style:normal;color:var(--muted);text-align:right;font-size:12px}

/* nav */
.nav{flex:none;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);width:96px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .pill{padding:4px 18px;border-radius:14px;display:grid;place-items:center}
.nav button.on{color:var(--ink)}.nav button.on .pill{background:var(--chip)}

/* generic */
.pad{padding:0 20px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.h4{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px}
.h4 b{font-size:16px;font-weight:800}.h4 button{font-size:13px;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:17px;background:var(--accent);color:#fff;font-size:16px;font-weight:800;width:100%}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:#E5484D}
.btn:disabled{opacity:.4}
.empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:14px;font-weight:600;line-height:1.5}
.flag{font-size:30px;line-height:1}

/* hero (trip) */
.hero{border-radius:26px;padding:20px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--hero1) 0%,var(--hero2) 45%,var(--hero3) 100%);box-shadow:0 14px 30px rgba(20,40,90,.25);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:24px solid rgba(255,255,255,.07);pointer-events:none}
.hero .hrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;opacity:.9;gap:10px}
.hero h3{font-size:20px;font-weight:800;margin:6px 0 14px;letter-spacing:-.3px}
.hero .sum{font-size:38px;font-weight:800;letter-spacing:-1.2px;line-height:1}
.hero .sum small{font-size:18px;font-weight:700;opacity:.8;letter-spacing:0}
.hero .prog{height:8px;border-radius:4px;background:rgba(255,255,255,.2);margin:14px 0 8px;overflow:hidden}
.hero .prog i{display:block;height:100%;background:#fff;border-radius:4px}
.hero .prog.over i{background:#FFB4A8}
.hero .meta{display:flex;justify-content:space-between;font-size:12px;font-weight:600;opacity:.9;gap:8px}
.hero .pers{margin-top:10px;font-size:12px;font-weight:700;opacity:.85}
.banner{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px;margin-top:12px;font-size:13px;font-weight:700;width:100%;text-align:left}
.banner .flag{font-size:26px}
.banner div{flex:1;min-width:0}.banner div span{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:1px}
.banner b{background:var(--ink);color:var(--bg);font-size:12px;padding:8px 12px;border-radius:10px;flex:none}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin-top:12px;padding:12px 0}
.strip div{text-align:center;border-left:1px solid var(--line);padding:0 6px;min-width:0}
.strip div:first-child{border-left:0}
.strip span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.strip b{display:block;font-size:17px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip small{font-size:11px;color:var(--muted);font-weight:700}
.cats{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:18px 0 10px}
.catleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:600;color:var(--muted)}
.catleg span{display:flex;align-items:center;gap:5px}.catleg i{width:8px;height:8px;border-radius:50%}
.exp{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left}
.exp .em{width:42px;height:42px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:20px;flex:none}
.exp div{flex:1;min-width:0}
.exp strong{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp span{font-size:12px;color:var(--muted);font-weight:600}
.exp .amt{text-align:right;flex:none}
.exp .amt strong{font-size:15px}
.day{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:16px 0 2px;display:flex;justify-content:space-between}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.4px;color:var(--wish);background:color-mix(in srgb,var(--wish) 14%,transparent);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.fab{position:absolute;right:20px;bottom:24px;width:62px;height:62px;border-radius:22px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 12px 26px rgba(17,21,28,.3);z-index:4}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}

/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);min-width:0}
.tile .v{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-top:6px;white-space:nowrap}
.tile .v small{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:0}
.tile .s{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.rings{display:flex;justify-content:space-between;background:var(--card);border-radius:22px;padding:16px 10px;box-shadow:var(--shadow);margin-top:10px}
.ring{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);flex:1;min-width:0}
.ring svg{width:54px;height:54px}
.ring text{font:800 13px Manrope,sans-serif;fill:var(--ink)}
.list{background:var(--card);border-radius:22px;padding:4px 16px;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .fl{font-size:18px;white-space:nowrap;min-width:30px;max-width:78px;overflow:hidden}
.li div{flex:1;min-width:0}.li strong{font-size:14px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li span{font-size:12px;color:var(--muted);font-weight:600}
.li .amt{text-align:right;font-size:14px;font-weight:800;flex:none}
.li .amt span{display:block}
.li .sd{width:10px;height:10px;border-radius:50%;flex:none}
.remind{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--wish) 12%,var(--card));margin-bottom:12px;font-size:13px;font-weight:700}
.remind div{flex:1}
.remind button{background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;padding:8px 12px;border-radius:10px}

/* layers: sheets and pages */
#layer{position:fixed;inset:0;pointer-events:none;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .22s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--card);border-radius:28px 28px 0 0;padding:8px 20px calc(20px + var(--safe-b));overflow-y:auto;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);pointer-events:auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.tall{height:92%}
.closing *{pointer-events:none!important}
.open .scrim{opacity:1}.open .sheet{transform:none}
.page{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);pointer-events:auto;display:flex;flex-direction:column}
.open .page{transform:none}
.page .scroll{padding-bottom:40px}
.back{display:flex;align-items:center;gap:6px}
.stitle{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:4px 0 14px}

.ctitle{display:flex;align-items:center;gap:12px}
.ctitle .flag{font-size:36px}
.ctitle h3{font-size:22px;font-weight:800;letter-spacing:-.4px}
.ctitle p{font-size:13px;color:var(--muted);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--chip);padding:4px;border-radius:14px}
.seg button{font-size:12px;font-weight:700;text-align:center;padding:9px 2px;border-radius:10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button i{width:8px;height:8px;border-radius:50%;display:block}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg.row1 button{flex-direction:row;justify-content:center;padding:9px 6px}
.visit{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.visit .num{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none}
.visit div{flex:1;min-width:0}
.visit strong{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visit span{font-size:12px;color:var(--muted);font-weight:600}
.visit .go{color:var(--muted);font-size:18px}
.add{margin-top:10px;border:1.5px dashed var(--line);border-radius:14px;padding:12px;text-align:center;font-size:14px;font-weight:700;color:var(--accent);width:100%}
.note{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.45}

.field{display:block;margin-top:12px}
.field>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.inp{width:100%;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-size:15px;font-weight:600;outline:none;appearance:none;-webkit-appearance:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:76px;padding:12px 14px;resize:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;gap:8px;margin-top:18px}

/* expense sheet */
.where{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.where button,.where label{background:var(--chip);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;position:relative;overflow:hidden}
.where input[type=date]{position:absolute;inset:0;opacity:0;width:100%}
.amount{text-align:center;margin:12px 0 0;font-size:50px;font-weight:800;letter-spacing:-2px;white-space:nowrap;overflow:hidden}
.amount small{font-size:21px;color:var(--muted);letter-spacing:0;font-weight:700}
.amount.zero{color:var(--muted)}
.conv{text-align:center;font-size:14px;font-weight:700;color:var(--accent);display:block;margin:2px auto 0}
.conv span{color:var(--muted);font-weight:600}
.conv.warn{color:#E5484D}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0 12px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:15px;background:var(--chip);font-size:10.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15;min-width:0}
.grid button em{font-style:normal;font-size:20px}
.mis{display:block;margin:8px auto 0;background:color-mix(in srgb,var(--wish) 16%,var(--card));color:var(--ink);font-size:12px;font-weight:700;padding:7px 12px;border-radius:12px}
.mis b{color:var(--accent)}
.destbtn{display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.destbtn .fl{font-size:22px}.destbtn .ph{color:var(--muted)}
.grid button.on{background:var(--ink);color:var(--bg)}
.opts{display:flex;gap:8px;align-items:center}
.mini{display:flex;background:var(--chip);border-radius:12px;padding:3px}
.mini button{font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;color:var(--muted)}
.mini button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.sw{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.sw i{width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw i:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw.on i{background:var(--wish)}.sw.on i:after{transform:translateX(16px)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.keys button{height:50px;border-radius:14px;display:grid;place-items:center;font-size:22px;font-weight:700;background:var(--bg)}
.keys button:active{background:var(--chip)}
.more{display:grid;gap:0;margin-top:10px}

/* pick list */
.search{position:relative;margin-bottom:8px}
.search input{padding-left:42px}
.search svg{position:absolute;left:14px;top:14px;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}

/* settings */
.group{margin-top:18px}
.group>.lbl{margin:0 0 8px 4px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:14px;font-weight:700;width:100%;text-align:left}
.set:first-child{border-top:0}
.set .val{color:var(--muted);font-weight:600;font-size:13px;text-align:right}
.set select{border:0;background:transparent;font-weight:700;color:var(--accent);text-align:right;max-width:55%;outline:none;font-size:14px}
.set .seg{min-width:190px}
.card>.rate:first-child{border-top:0}
.rate{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;font-weight:700}
.rate input{width:110px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 10px;font-weight:700;text-align:right;outline:none}
.rate .x{margin-left:auto;color:var(--muted);font-size:20px;width:32px;height:32px}

/* dialog + toast */
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-40%) scale(.96);opacity:0;background:var(--card);border-radius:24px;padding:22px 20px 16px;transition:all .2s;pointer-events:auto}
.open .dialog{opacity:1;transform:translateY(-50%)}
.dialog p{font-size:15px;font-weight:700;line-height:1.45}
.dialog .dbtns{display:flex;gap:8px;margin-top:18px}
.dialog .dbtns .btn{height:46px;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 18px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;transition:all .2s;z-index:50;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.shareimg{width:100%;border-radius:18px;display:block;margin:4px 0 14px;box-shadow:var(--shadow)}

/* companions, cash, timeline, comparison */
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipset .chip{font-size:14px;padding:9px 16px}
.split{display:block;margin:10px auto 0;background:var(--chip);color:var(--ink);font-size:12px;font-weight:700;padding:7px 12px;border-radius:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-top:12px}
.addrow .btn{width:auto;height:48px;padding:0 16px;font-size:15px}
.addrow .cur{height:48px;border-radius:14px;background:var(--chip);padding:0 14px;font-weight:800}
.yr{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px}
.yr b{font-size:22px;font-weight:800;letter-spacing:-.4px}
.yr span{font-size:12px;color:var(--muted);font-weight:700}
.cmp{padding:14px 16px;margin-bottom:10px}
.cmp .li{padding:0}
.cmp .t{height:8px;border-radius:4px;background:var(--chip);margin:12px 0 10px;overflow:hidden}
.cmp .t i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--v2),var(--v3))}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ---------------- Country data ---------------- */

const META = D.meta;                         // iso2 -> [continent, counted(1/0), currency, English name]
const CONTS = ["EU", "AS", "AF", "AM", "OC"];
const COUNTED = Object.keys(META).filter(c => META[c][1]);
const TOTAL = { W: COUNTED.length };
for (const c of CONTS) TOTAL[c] = COUNTED.filter(i => META[i][0] === c).length;
const FEATURES = topojson.feature(D.topo, D.topo.objects.countries).features;
const FEAT = new Map(FEATURES.filter(f => f.id).map(f => [f.id, f]));

// Countries too small to tap on the map get a dot.
const DOTS = [];
for (const f of FEATURES) {
  if (!f.id || d3.geoArea(f) > 4e-5) continue;
  let g = f.geometry;
  if (g.type === "MultiPolygon") {
    g = g.coordinates.map(c => ({ type: "Polygon", coordinates: c })).sort((a, b) => d3.geoArea(b) - d3.geoArea(a))[0];
  }
  DOTS.push({ id: f.id, c: d3.geoCentroid(g) });
}

let LANG = "en";
function detectLang() {
  const l = (navigator.languages && navigator.languages[0] || navigator.language || "en").toLowerCase();
  if (l.startsWith("sr")) return "sr";
  if (l.startsWith("nb") || l.startsWith("nn") || l.startsWith("no")) return "nb";
  return "en";
}
function t(key, vars) {
  let s = T[LANG][key] ?? T.en[key] ?? key;
  if (typeof s === "object") s = s.other;
  return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "") : s;
}
let PLURAL = new Intl.PluralRules("en");
function tn(key, n) {
  const forms = T[LANG][key] || T.en[key];

}
let regionNames = null, currencyNames = null;
function cname(iso) {
  if (LANG === "en") return META[iso]?.[3] || iso;
  const fix = NAME_FIX[LANG]?.[iso];
  if (fix) return fix;

    if (n && n !== iso) return n;
  } catch (e) {}
  return META[iso]?.[3] || iso;
}

}

/* ---------------- Formatting ---------------- */
let NF0, NF2, DFs, DFl;
function setLocale() {
  const loc = LOCALES[LANG];
  PLURAL = new Intl.PluralRules(loc);
  NF0 = new Intl.NumberFormat(loc, { maximumFractionDigits: 0 });
  NF2 = new Intl.NumberFormat(loc, { maximumFractionDigits: 2 });
  DFs = new Intl.DateTimeFormat(loc, { day: "numeric", month: "short" });
  DFl = new Intl.DateTimeFormat(loc, { day: "numeric", month: "short", year: "numeric" });
  try { regionNames = new Intl.DisplayNames([loc], { type: "region" }); } catch (e) { regionNames = null; }
  try { currencyNames = new Intl.DisplayNames([loc], { type: "currency" }); } catch (e) { currencyNames = null; }
  document.documentElement.lang = LANG;
}
const fmtNum = n => NF0.format(n);
const fmtAmt = n => (Math.abs(n) >= 100 ? NF0 : NF2).format(n);
const fmtMoney = (n, cur) => fmtAmt(n) + " " + cur;
function fmtRate(r) {
  if (!r) return "–";
  const d = r >= 100 ? 0 : r >= 1 ? 2 : r >= 0.01 ? 4 : 6;
  return new Intl.NumberFormat(LOCALES[LANG], { maximumFractionDigits: d }).format(r);
}
const pd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const today = () => iso(new Date());
const dayDiff = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
function fmtDate(s, withYear) { return s ? (withYear ? DFl : DFs).format(pd(s)) : ""; }
function fmtRange(a, b) {
  if (!a && !b) return t("v.noDates");
  if (!b || a === b) return fmtDate(a || b, true);
  if (!a) return fmtDate(b, true);
  const sameYear = a.slice(0, 4) === b.slice(0, 4);
  return `${fmtDate(a, !sameYear)} – ${fmtDate(b, true)}`;

/* ---------------- Storage ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open("globetint", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  get(k) {
    if (!this.db) return Promise.resolve(JSON.parse(localStorage.getItem("gt:" + k) || "null"));
    return new Promise(res => {
      const q = this.db.transaction("kv").objectStore("kv").get(k);
      q.onsuccess = () => res(q.result ?? null);
      q.onerror = () => res(null);
    });
  },
  set(k, v) {
    if (!this.db) { localStorage.setItem("gt:" + k, JSON.stringify(v)); return Promise.resolve(); }
    return new Promise(res => {
      const tx = this.db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.oncomplete = () => res();
      tx.onerror = () => res();
    });
  },
};

function guessHome() {
  const l = navigator.language || "";
  const region = (l.split("-")[1] || "").toUpperCase();
  if (META[region]?.[2]) return META[region][2];
  if (l.startsWith("sr")) return "RSD";
  if (l.startsWith("nb") || l.startsWith("no")) return "NOK";
  return "EUR";
}

const cget = iso => S.countries[iso] || { status: null, visits: [] };

function shade(iso) {
  const c = S.countries[iso];
  if (!c || !c.status) return "";
  if (c.status === "lived") return "lv";
  if (c.status === "wish") return "ws";
  const n = Math.max(1, c.visits?.length || 0);
  return n >= 5 ? "v4" : n >= 3 ? "v3" : n === 2 ? "v2" : "v1";
}
function counts(region) {
  const ids = region === "W" ? COUNTED : COUNTED.filter(i => META[i][0] === region);
  let v = 0, lived = 0, wish = 0;
  for (const i of ids) {
    const s = S.countries[i]?.status;
    if (s === "visited" || s === "lived") v++;
    if (s === "lived") lived++;

/* ---------------- Exchange rates ----------------
   Every expense stores the rate used when it was saved, so later rate
   changes never change old totals. Rates: manual (settings) first, then
   the downloaded table (units per 1 base currency). */
function rateOf(from, to) {
  if (from === to) return 1;
  const m = S.settings.manual[from + "/" + to];
  if (m > 0) return m;
  const back = S.settings.manual[to + "/" + from];
  if (back > 0) return 1 / back;
  const R = S.rates?.rates;
  if (R) {
    const a = from === S.rates.base ? 1 : R[from], b = to === S.rates.base ? 1 : R[to];
    if (a > 0 && b > 0) return b / a;
  }
  return null;
}
async function fetchRates(manual) {

    const r = await fetch(`https://open.er-api.com/v6/latest/${home}`, { cache: "no-store" });
    const j = await r.json();

/* ---------------- Travel companions ----------------
   A trip may list companions (trip.people). An expense then carries paidBy
   (a companion id; none = me) and split (who shares it; none = only me).
   Totals and the budget count only my part. */
const ME = "me";

  const bal = { [ME]: 0 };

  for (const e of tripExp(trip.id)) {
    if (!e.paidBy && !e.split) continue;
    const sp = splitOf(e);
    const by = e.paidBy || ME;
    bal[by] = (bal[by] || 0) + e.homeAmount;
    for (const id of sp) bal[id] = (bal[id] || 0) - e.homeAmount / sp.length;
  }
  const debt = Object.entries(bal).filter(([, v]) => v < -0.005).map(([id, v]) => [id, -v]);
  const cred = Object.entries(bal).filter(([, v]) => v > 0.005);
  const out = [];
  for (const d of debt) for (const c of cred) {
    const x = Math.min(d[1], c[1]);

    `<div class="scrim"></div><div class="sheet ${kind === "tall" ? "tall" : ""}">${html}</div>`;
  $("#layer").appendChild(el);
  const entry = { el, onClose };
  stack.push(entry);
  const scrim = $(".scrim", el);
  // Ignore the click that a touch generates right after the tap that opened this layer.
  const opened = Date.now();

  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("open")));

      "dialog", () => { if (!done) res(false); });

}

function countryKeys() {

  for (const code of Object.keys(META)) {

    for (const d of Object.values(dn)) { try { names.add(d.of(code)); } catch (e) {} }

function detectCountry(text) {
  const words = plain(text).split(" ").filter(Boolean);
  if (!words.length) return null;
  const q = " " + words.join(" ") + " ";
  // Serbian and Norwegian endings: "Грчкој", "Будимпешти", "Italiji" still match.
  const hit = key => {
    if (q.includes(" " + key + " ")) return true;
    if (key.length < 5 || key.includes(" ") || !/[aeiou]$/.test(key)) return false;
    const stem = key.slice(0, -1);
    return words.some(w => w.startsWith(stem) && w.length <= key.length + 2);
  };
  let best = null, len = 0;
  for (const [key, code] of [...PLACES, ...countryKeys()]) if (key.length > len && hit(key)) { best = code; len = key.length; }
  return best;
}

    <label class="field"><span>${t("t.people")}</span><input class="inp" id="tp" placeholder="${esc(t("t.peoplePh"))}" value="${esc((trip?.people || []).map(p => p.name).join(", "))}"></label>
    <div class="actions"><button class="btn" id="tsave">${t("b.save")}</button>
    ${trip ? `<button class="btn danger" id="tdel">${t("t.del")}</button>` : ""}</div>`, "sheet");
  // Trip country: from the name ("Budapest", "Будимпешта" → Hungary), from GPS, or picked by hand.
  const fallback = trip?.country || gpsSuggest || null;
  let dest = fallback, auto = false, manual = !!trip?.country;
  const drawDest = () => {
    $("#td", el).innerHTML = dest
      ? `<span class="fl">${flag(dest)}</span><span>${esc(cname(dest))} · ${META[dest][2] || ""}</span>`
      : `<span class="fl">🌍</span><span class="ph">${t("t.pick")}</span>`;
    $("#tdh", el).textContent = auto ? "✨ " + t("t.destAuto") : "";
  };
  drawDest();
  $("#tn", el).addEventListener("input", e => {
    if (manual) return;
    const found = detectCountry(e.target.value);
    if (found) { dest = found; auto = true; }
    else if (auto) { dest = fallback; auto = false; }
    drawDest();
  });
  $("#td", el).addEventListener("click", () => openList(code => { dest = code; auto = false; manual = true; drawDest(); }, t("t.pick")));
  $("#tf", el).addEventListener("change", e => { if ($("#tt", el).value && $("#tt", el).value < e.target.value) $("#tt", el).value = e.target.value; });
  $("#tsave", el).addEventListener("click", async () => {
    let from = $("#tf", el).value, to = $("#tt", el).value;
    if (from && to && to < from) [from, to] = [to, from];
    const people = readPeople($("#tp", el).value, trip);
    const gone = (trip?.people || []).filter(p => !people.some(q => q.id === p.id)).map(p => p.id);
    if (gone.length && tripExp(trip.id).some(e => gone.includes(e.paidBy) || e.split?.some(id => gone.includes(id)))) {
      if (!await confirmBox(t("t.peopleQ"), t("b.ok"))) return;
      for (const e of tripExp(trip.id)) dropPeople(e, gone);
    }
    const data = { name: $("#tn", el).value.trim() || t("t.defName"), from, to, budget: parseNum($("#tb", el).value) || 0, people };
    if (dest && (!trip || dest !== trip.country)) { data.country = dest; data.currency = META[dest][2] || (trip ? trip.cur : S.settings.home); }
    if (trip) Object.assign(trip, data);
    else {
      const nt = { id: uid(), cur: S.settings.home, country: null, created: Date.now(), ...data };
      if (nt.country) S.settings.lastCountry = nt.country;
      S.trips.push(nt);
      S.settings.currentTrip = nt.id;
      viewTripId = null;
    }
    save(); closeLayer(); renderTrip();
  });
  if (trip) $("#tdel", el).addEventListener("click", async () => {
    if (!await confirmBox(t("t.delQ"), t("b.delete"), true)) return;
    S.expenses = S.expenses.filter(e => e.tripId !== trip.id);
    S.trips = S.trips.filter(x => x.id !== trip.id);
    syncTripVisits(trip.id);
    if (S.settings.currentTrip === trip.id) S.settings.currentTrip = null;
    viewTripId = null;
    save(); closeLayer(); renderTrip(); refreshMap();
  });
}
/** "Ana, Marko" → [{id, name}], keeping the ids of names the trip already had. */
function readPeople(text, trip) {
  const seen = new Set();
  return text.split(/[,;\n]/).map(n => n.trim()).filter(n => n && !seen.has(n.toLowerCase()) && seen.add(n.toLowerCase()))
    .map(name => trip?.people?.find(p => p.name.toLowerCase() === name.toLowerCase()) || { id: uid(), name });
}
/** Takes removed companions out of an expense: their payments become mine, their shares go away. */
function dropPeople(e, ids) {
  if (ids.includes(e.paidBy)) delete e.paidBy;
  if (e.split) {
    e.split = e.split.filter(id => !ids.includes(id));
    if (!e.split.length || (e.split.length === 1 && e.split[0] === ME)) delete e.split;
  }
}
function tripMenu() {
  const trip = tripById(viewTripId) || tripById(S.settings.currentTrip);
  if (!trip) return;
  const isCur = trip.id === S.settings.currentTrip;
  const el = pushLayer(`<div class="grab"></div><div class="stitle">${esc(trip.name)}</div><div class="list">
    <button class="li" data-m="edit"><span class="fl">✏️</span><div><strong>${t("t.edit")}</strong></div></button>
    ${isCur ? `<button class="li" data-m="end"><span class="fl">🏁</span><div><strong>${t("t.end")}</strong></div></button>` :
      `<button class="li" data-m="resume"><span class="fl">▶️</span><div><strong>${t("t.resume")}</strong></div></button>`}
    <button class="li" data-m="cash"><span class="fl">💵</span><div><strong>${t("cash.title")}</strong></div></button>
    ${tripExp(trip.id).length ? `<button class="li" data-m="csv"><span class="fl">📄</span><div><strong>${t("t.csv")}</strong></div></button>` : ""}
    </div>`, "sheet");
  el.addEventListener("click", e => {
    const m = e.target.closest("[data-m]")?.dataset.m;
    if (!m) return;
    closeLayer();
    if (m === "edit") openTripForm(trip);

    if (m === "cash") openCash(trip);
    if (m === "csv") exportCsv([trip]);
  });
}
function setTripCountry(trip, code) {
  trip.country = code;
  trip.currency = META[code][2] || trip.cur;
  S.settings.lastCountry = code;
  save(); renderTrip();
}

function openCash(trip) {
  let cur = trip.currency || trip.cur;
  const el = pushLayer(`<div class="grab"></div><div class="stitle">💵 ${t("cash.title")}</div><div id="cs"></div>`, "sheet");
  const draw = () => {
    const left = Object.entries(cashLeft(trip));
    const list = [...(trip.cash || [])].sort((a, b) => b.date.localeCompare(a.date));
    $("#cs", el).innerHTML = `
      ${left.length ? `<div class="strip" style="grid-template-columns:repeat(${Math.min(3, left.length)},1fr);margin-top:0">${left.map(([c, v]) =>
        `<div><span>${t("cash.left")}</span><b style="${v < 0 ? "color:#E5484D" : ""}">${NF2.format(v)} <small>${c}</small></b></div>`).join("")}</div>` : ""}
      <div class="field"><span>${t("cash.amount")}</span><div class="addrow" style="margin-top:0">
        <input class="inp" id="ca" inputmode="decimal" placeholder="0"><button class="cur" id="cc">${cur} ▾</button><button class="btn" id="cadd">${t("cash.add")}</button></div></div>
      <div class="note">${t("cash.hint")}</div>
      ${list.length ? `<div class="list" style="margin-top:14px;box-shadow:none;background:var(--bg)">${list.map(c =>
        `<div class="rate"><span>${esc(fmtDate(c.date, true))}</span><span style="margin-left:auto">${NF2.format(c.amount)} ${c.currency}</span><button class="x" style="margin-left:4px" data-del="${c.id}">×</button></div>`).join("")}</div>`
        : `<div class="empty" style="padding:18px 0 4px">${t("cash.none")}</div>`}`;
  };
  draw();
  el.addEventListener("click", e => {
    if (e.target.closest("#cc")) pickCurrency(c => { cur = c; $("#cc", el).textContent = c + " ▾"; });
    if (e.target.closest("#cadd")) {
      const a = parseNum($("#ca", el).value);
      if (!(a > 0)) return;
      (trip.cash || (trip.cash = [])).push({ id: uid(), date: today(), currency: cur, amount: a });
      save(); draw(); renderTrip();
    }
    const del = e.target.closest("[data-del]")?.dataset.del;
    if (del) {
      trip.cash = trip.cash.filter(c => c.id !== del);
      if (!trip.cash.length) delete trip.cash;
      save(); draw(); renderTrip();
    }
  });
}

/* Location: one reading when the trip tab opens; the country comes from the
   bundled borders, so no internet is needed. */
let lastLocate = 0;
function maybeLocate() {
  const trip = tripById(S.settings.currentTrip);
  if (!trip || !navigator.geolocation || Date.now() - lastLocate < 20 * 60e3) return;
  lastLocate = Date.now();
  navigator.geolocation.getCurrentPosition(p => {
    const pt = [p.coords.longitude, p.coords.latitude];
    const f = FEATURES.find(f => f.id && d3.geoContains(f, pt));
    if (!f) return;
    gpsSuggest = f.id;
    const tr = tripById(S.settings.currentTrip);
    if (tr && !tr.country) setTripCountry(tr, f.id);
    else if (curTab === "trip") renderTrip();
  }, () => {}, { enableHighAccuracy: false, timeout: 15000, maximumAge: 30 * 60e3 });
}

/* ---------------- Expense sheet ---------------- */
const decSep = () => (1.5).toLocaleString(LOCALES[LANG]).charAt(1);
function parseNum(s) {
  s = String(s || "").trim().replace(/\s/g, "");
  if (!s) return 0;
  const sep = decSep();
  s = sep === "," ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function openExpense(id) {
  const trip = tripById(viewTripId) || tripById(S.settings.currentTrip);
  if (!trip) return;
  const old = id ? S.expenses.find(e => e.id === id) : null;
  const country = old?.country || trip.country || S.settings.lastCountry || null;
  const x = {
    country, currency: old?.currency || trip.currency || (country ? META[country][2] : trip.cur) || trip.cur,
    date: old?.date || (trip.to && today() > trip.to ? trip.to : trip.from && today() < trip.from ? trip.from : today()),
    amt: old ? String(old.amount).replace(".", decSep()) : "",
    cat: old?.cat || null, pay: old?.pay || "card", personal: old?.personal || false, note: old?.note || "",
    homeOverride: old && old.manualHome ? String(old.homeAmount).replace(".", decSep()) : "", more: !!(old && (old.note || old.manualHome)),
    paidBy: old?.paidBy || ME, split: old ? [...splitOf(old)] : null,
  };
  const people = trip.people || [];
  const everyone = [ME, ...people.map(p => p.id)];
  if (!x.split) x.split = people.length ? everyone : [ME];
  const el = pushLayer(`<div class="grab"></div><div id="xs"></div>`, "tall");
  const amount = () => parseNum(x.amt);
  const rate = () => old && old.currency === x.currency && old.tripCur === trip.cur && !old.manualHome && old.rate ? old.rate : rateOf(x.currency, trip.cur);
  const homeVal = () => {
    const o = parseNum(x.homeOverride);
    if (o > 0) return o;
    const r = rate();
    return r ? amount() * r : null;
  };
  const draw = () => {
    const a = amount(), r = rate(), hv = homeVal();
    let conv;
    if (x.currency === trip.cur) conv = `<span class="conv"><span>${t("e.homeAmt", { cur: trip.cur })}</span></span>`;
    else if (!a && r) conv = `<button class="conv" data-x="more"><span>${rateLine(x.currency, trip.cur, "")}</span></button>`;
    else if (hv != null) conv = `<button class="conv" data-x="more">≈ ${fmtMoney(hv, trip.cur)}${r ? ` <span>· ${rateLine(x.currency, trip.cur, "")}</span>` : ""}</button>`;
    else conv = `<button class="conv warn" data-x="more">${esc(t("e.noRate", { cur: x.currency, home: trip.cur }))}</button>`;
    $("#xs", el).innerHTML = `
      <div class="where"><button data-x="country">${x.country ? flag(x.country) + " " + esc(cname(x.country)) : "🌍 " + t("t.pick")} ▾</button>
        <button data-x="cur">${x.currency} ▾</button>
        <label>${esc(x.date === today() ? t("t.today") : fmtDate(x.date))} ▾<input type="date" id="xd" value="${x.date}"></label></div>
      <div class="amount ${a ? "" : "zero"}">${a ? esc(x.amt) : "0"} <small>${x.currency}</small></div>
      ${conv}
      ${x.country && META[x.country][2] && x.currency !== META[x.country][2] ? `<button class="mis" data-x="fixcur">⚠️ ${esc(t("e.localCur", { c: cname(x.country), cur: META[x.country][2] }))} · <b>${t("e.switchCur")}</b></button>` : ""}
      <div class="grid">${CATS.map(([k, e]) => `<button class="${x.cat === k ? "on" : ""}" data-cat="${k}"><em>${e}</em>${t("cat." + k)}</button>`).join("")}</div>
      <div class="opts"><div class="mini"><button class="${x.pay === "card" ? "on" : ""}" data-pay="card">${t("e.card")}</button><button class="${x.pay === "cash" ? "on" : ""}" data-pay="cash">${t("e.cash")}</button></div>
        <button class="sw ${x.personal ? "on" : ""}" data-x="personal">${t("e.personal")}<i></i></button></div>
      ${people.length ? `<button class="split" data-x="split">👥 ${esc(t("sp.btn", { who: personName(trip, x.paidBy),
        list: x.split.length === everyone.length ? t("sp.all") : x.split.map(id => personName(trip, id)).join(", ") }))}</button>` : ""}
      ${x.more ? `<div class="more">
        ${x.currency !== trip.cur ? `<label class="field"><span>${t("e.homeAmt", { cur: trip.cur })} · ${t("e.homeHint")}</span><input class="inp" id="xh" inputmode="decimal" value="${esc(x.homeOverride)}" placeholder="${hv != null && !parseNum(x.homeOverride) ? esc(fmtAmt(hv)) : ""}"></label>` : ""}
        <label class="field"><span>${t("e.note")}</span><input class="inp" id="xn" value="${esc(x.note)}"></label></div>` :
        `<button class="note" data-x="more" style="display:block;margin:10px auto 0;color:var(--accent);font-weight:700">+ ${t("e.more", { cur: trip.cur })}</button>`}
      <div class="keys">${["1","2","3","4","5","6","7","8","9",decSep(),"0","⌫"].map(k => `<button data-k="${k}">${k}</button>`).join("")}</div>
      <div class="actions"><button class="btn" id="xsave" ${a > 0 && hv != null && x.country ? "" : "disabled"}>${t("b.save")}</button>
      ${old ? `<button class="btn danger" data-x="del">${t("e.delete")}</button>` : ""}</div>`;
    $("#xd", el).addEventListener("change", e => { if (e.target.value) { x.date = e.target.value; draw(); } });
    const xh = $("#xh", el), xn = $("#xn", el);
    if (xh) xh.addEventListener("input", e => { x.homeOverride = e.target.value; updateSave(); });
    if (xn) xn.addEventListener("input", e => { x.note = e.target.value; });
  };
  const updateSave = () => {
    const hv = homeVal();
    $("#xsave", el).disabled = !(amount() > 0 && hv != null && x.country);
  };
  // A personal purchase is usually just mine; anything else is shared by default.
  const setPersonal = on => { x.personal = on; if (!old && people.length) x.split = on ? [ME] : everyone; };
  draw();
  el.addEventListener("click", async e => {
    const k = e.target.closest("[data-k]")?.dataset.k;
    if (k) {
      if (k === "⌫") x.amt = x.amt.slice(0, -1);
      else if (k === decSep()) { if (!x.amt.includes(k)) x.amt = (x.amt || "0") + k; }
      else {
        const [i, f] = x.amt.split(decSep());
        if (f !== undefined && f.length >= 2) return;
        if (f === undefined && (i || "").length >= 9) return;
        x.amt = x.amt === "0" ? k : x.amt + k;
      }
      draw(); return;
    }
    const cat = e.target.closest("[data-cat]")?.dataset.cat;
    if (cat) { x.cat = cat; if (!old) setPersonal(PERSONAL_CATS.has(cat)); draw(); return; }
    const pay = e.target.closest("[data-pay]")?.dataset.pay;
    if (pay) { x.pay = pay; draw(); return; }
    const act = e.target.closest("[data-x]")?.dataset.x;
    if (act === "personal") { setPersonal(!x.personal); draw(); }
    if (act === "split") openSplit(trip, x, draw);
    if (act === "more") { x.more = true; draw(); }
    if (act === "country") openList(code => { x.country = code; x.currency = META[code][2] || x.currency; x.homeOverride = ""; draw(); }, t("t.pick"));
    if (act === "cur") pickCurrency(c => { x.currency = c; x.homeOverride = ""; draw(); });
    if (act === "fixcur") { x.currency = META[x.country][2]; x.homeOverride = ""; draw(); }
    if (act === "del") {
      S.expenses = S.expenses.filter(z => z.id !== old.id);
      syncTripVisits(trip.id);
      save(); closeLayer(); renderTrip(); refreshMap();
    }
    if (e.target.closest("#xsave")) {
      const a = amount(), hv = homeVal();
      if (!(a > 0 && hv != null && x.country)) return;
      const manualHome = parseNum(x.homeOverride) > 0;
      const rec = {
        tripId: trip.id, date: x.date, country: x.country, currency: x.currency, amount: a,
        rate: manualHome ? hv / a : (x.currency === trip.cur ? 1 : rate()), tripCur: trip.cur,
        homeAmount: Math.round(hv * 100) / 100, manualHome, cat: x.cat || "other", pay: x.pay, personal: x.personal, note: x.note.trim(),
        paidBy: people.length && x.paidBy !== ME ? x.paidBy : undefined,
        split: people.length && !(x.split.length === 1 && x.split[0] === ME) ? x.split : undefined,
      };
      if (!rec.paidBy) delete rec.paidBy;
      if (!rec.split) delete rec.split;
      if (old) { delete old.paidBy; delete old.split; }
      if (old) Object.assign(old, rec);
      else S.expenses.push({ id: uid(), t: Date.now(), ...rec });
      if (trip.id === S.settings.currentTrip && x.date === today() && trip.country !== x.country) {
        trip.country = x.country; trip.currency = x.currency;
      }
      S.settings.lastCountry = x.country;
      syncTripVisits(trip.id);
      save(); closeLayer(); renderTrip(); refreshMap();
    }
  });
}

/** Who paid and who shares an expense; edits x in place. */
function openSplit(trip, x, redraw) {
  const ids = [ME, ...trip.people.map(p => p.id)];
  const el = pushLayer(`<div class="grab"></div><div class="stitle">👥 ${t("sp.title")}</div><div id="ss"></div>
    <div class="actions"><button class="btn" data-ok>${t("b.ok")}</button></div>`, "sheet", redraw);
  const draw = () => {
    const chips = (key, on) => `<div class="chipset">${ids.map(id => `<button class="chip ${on(id) ? "on" : ""}" data-${key}="${id}">${esc(personName(trip, id))}</button>`).join("")}</div>`;
    $("#ss", el).innerHTML = `<div class="field"><span>${t("sp.paid")}</span>${chips("by", id => x.paidBy === id)}</div>
      <div class="field" style="margin-top:16px"><span>${t("sp.among")}</span>${chips("in", id => x.split.includes(id))}</div>
      <div class="note">${t("sp.hint")}</div>`;
  };
  draw();
  el.addEventListener("click", e => {
    const by = e.target.closest("[data-by]")?.dataset.by;
    if (by) { x.paidBy = by; draw(); return; }
    const inn = e.target.closest("[data-in]")?.dataset.in;
    if (inn) {
      if (!x.split.includes(inn)) x.split = ids.filter(id => id === inn || x.split.includes(id));
      else if (x.split.length > 1) x.split = x.split.filter(id => id !== inn);
      draw(); return;
    }
    if (e.target.closest("[data-ok]")) closeLayer();
  });
}

  for (const c of Object.values(S.countries)) for (const v of c.visits || []) if (v.from && v.to) d += dayDiff(v.from, v.to) + 1;
  return d;
}

      </div>
      <div class="rings">${CONTS.map(k => {

/** Every dated visit grouped by year, newest first; countries without dates at the end. */
function openTimeline() {
  const years = {}, first = {}, undated = [];
  for (const [code, c] of Object.entries(S.countries)) {
    const dated = (c.visits || []).filter(v => v.from);
    for (const v of dated) (years[v.from.slice(0, 4)] || (years[v.from.slice(0, 4)] = [])).push({ code, v });
    if (dated.length) first[code] = dated.map(v => v.from).sort()[0].slice(0, 4);
    else if (isVisited(code)) undated.push(code);
  }
  const row = (code, sub) => `<button class="li" data-country="${code}"><span class="fl">${flag(code)}</span><div><strong>${esc(cname(code))}</strong><span>${esc(sub)}</span></div><span class="go muted">›</span></button>`;
  const body = Object.keys(years).sort().reverse().map(y => {
    const list = years[y].sort((a, b) => b.v.from.localeCompare(a.v.from));
    const countries = new Set(list.map(x => x.code)), fresh = [...countries].filter(c => first[c] === y).length;
    return `<div class="yr"><b>${y}</b><span>${tn("pl.countries", countries.size)}${fresh ? " · " + tn("pl.new", fresh) : ""}</span></div>
      <div class="list">${list.map(({ code, v }) => row(code, [v.place || tripById(v.tripId)?.name, fmtRange(v.from, v.to)].filter(Boolean).join(" · "))).join("")}</div>`;
  }).join("") + (undated.length ? `<div class="yr"><b>${t("s.undated")}</b><span>${tn("pl.countries", undated.length)}</span></div>
      <div class="list">${undated.sort((a, b) => cname(a).localeCompare(cname(b))).map(c => row(c, t("st." + S.countries[c].status))).join("")}</div>` : "");
  openPage(t("s.timeline"), body || `<div class="empty">${t("c.noVisits")}</div>`);
}
/** Trips side by side: average per day in the home currency and the biggest categories. */
function openCompare() {
  const home = S.settings.home;
  const list = S.trips.filter(tr => tripExp(tr.id).length).map(tr => {
    const tot = tripTotals(tr), r = rateOf(tr.cur, home), cur = r ? home : tr.cur, k = r || 1;
    return { tr, tot, cur, total: tot.total * k, avg: tot.total * k / tripElapsed(tr), days: tripElapsed(tr) };
  }).sort((a, b) => b.avg - a.avg);
  const max = Math.max(...list.filter(x => x.cur === home).map(x => x.avg), 1);
  openPage(t("s.compare"), list.map(({ tr, tot, cur, total, avg, days }) => {
    const cats = Object.entries(tot.byCat).sort((a, b) => b[1] - a[1]).slice(0, 4);
    const cc = tripCountries(tr);
    return `<div class="card cmp"><button class="li" data-act="openTrip" data-v="${tr.id}"><span class="fl">${cc.length ? cc.slice(0, 3).map(flag).join("") : "🧳"}</span>
        <div><strong>${esc(tr.name)}</strong><span>${tn("pl.days", days)} · ${fmtMoney(total, cur)}</span></div>
        <div class="amt">${fmtAmt(avg)}<span class="muted">${esc(t("s.perDay", { cur }))}</span></div></button>
      <div class="t"><i style="width:${cur === home ? (avg / max * 100).toFixed(1) : 0}%"></i></div>
      <div class="catleg">${cats.map(([c, v]) => `<span><i style="background:${CAT[c].c}"></i>${t("cat." + c)} ${Math.round(v / tot.total * 100)}%</span>`).join("")}</div></div>`;
  }).join(""));
}
function compact(n) {
  if (n < 1e6) return fmtNum(n);
  try { return new Intl.NumberFormat(LOCALES[LANG], { notation: "compact", maximumFractionDigits: 1 }).format(n); }
  catch (e) { return fmtNum(n); }
}

// The share image always has a dark background, so each palette uses its dark-theme shades.
const SHARE_COLORS = {
  blue: { map: { v1: "#A9D1FF", v2: "#5FA8F5", v3: "#2F7BE0", v4: "#1D4FA3", lv: "#22B573", ws: "#FF7F6B" },

          glow1: "rgba(176,47,108,.8)", glow2: "rgba(94,22,64,.9)", text: ["#FFC6DE", "#EE86B6"] },
  violet: { map: { v1: "#43377D", v2: "#5D4BAE", v3: "#7F6BDD", v4: "#A594F5", lv: "#DCD3FF", ws: "#F0A030" },
          glow1: "rgba(91,63,192,.85)", glow2: "rgba(44,26,110,.9)", text: ["#DCD3FF", "#A594F5"] },
};
async function drawShare() {
  await document.fonts.load("800 40px Manrope").catch(() => {});
  const W = 1080, H = 1920, cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const P = SHARE_COLORS[S.settings.palette] || SHARE_COLORS.blue;
  x.fillStyle = "#0A0E18"; x.fillRect(0, 0, W, H);
  const g1 = x.createRadialGradient(200, 0, 0, 200, 0, 1100);
  g1.addColorStop(0, P.glow1); g1.addColorStop(1, "rgba(10,14,24,0)");
  x.fillStyle = g1; x.fillRect(0, 0, W, H);
  const g2 = x.createRadialGradient(W, H, 0, W, H, 900);
  g2.addColorStop(0, P.glow2); g2.addColorStop(1, "rgba(10,14,24,0)");
  x.fillStyle = g2; x.fillRect(0, 0, W, H);
  const F = (w, s) => `${w} ${s}px Manrope, sans-serif`;
  // brand
  const cg = x.createConicGradient ? x.createConicGradient(3.5, 112, 150) : null;
  if (cg) { [P.map.v2, P.map.v4, P.map.lv, P.map.ws, P.map.v2].forEach((c, i) => cg.addColorStop(i / 4, c)); x.fillStyle = cg; } else x.fillStyle = P.map.v3;
  x.beginPath(); x.arc(112, 150, 26, 0, 7); x.fill();
  x.fillStyle = "#fff"; x.font = F(800, 44); x.textBaseline = "middle"; x.fillText("GlobeTint", 156, 152);
  // headline
  const w = counts("W");
  x.textBaseline = "alphabetic";
  x.font = F(800, 118); x.fillText(t("sh.head"), 80, 400);
  const pct = t("sh.pct", { p: fmtPct(w.pct) });
  const tg = x.createLinearGradient(80, 0, 1000, 0);
  tg.addColorStop(0, P.text[0]); tg.addColorStop(1, P.text[1]);
  x.fillStyle = tg;
  let fs = 108; x.font = F(800, fs);
  while (x.measureText(pct).width > 920 && fs > 60) { fs -= 4; x.font = F(800, fs); }
  x.fillText(pct, 80, 530);
  const conts = CONTS.filter(k => counts(k).v > 0).length;
  x.fillStyle = "rgba(255,255,255,.7)"; x.font = F(600, 40);
  x.fillText([tn("pl.countries", w.v), tn("pl.continents", conts), tn("pl.trips", S.trips.length)].join(" · "), 80, 610);
  // map
  const proj = d3.geoEqualEarth().rotate([-11, 0]).fitExtent([[40, 680], [W - 40, 1180]], { type: "Sphere" });
  const path = d3.geoPath(proj, x);
  const col = P.map;
  x.lineWidth = 1; x.strokeStyle = "#0A0E18";
  for (const f of FEATURES) {
    x.beginPath(); path(f);
    x.fillStyle = f.id && shade(f.id) ? col[shade(f.id)] : "rgba(255,255,255,.13)";
    x.fill(); x.stroke();
  }
  // continent bars
  let y = 1290;
  for (const k of CONTS) {
    const c = counts(k);
    x.fillStyle = "#fff"; x.font = F(700, 36); x.fillText(t("r." + k), 80, y + 12);
    x.fillStyle = "rgba(255,255,255,.1)"; roundRect(x, 330, y - 8, 560, 16, 8); x.fill();
    if (c.pct > 0) { const bg = x.createLinearGradient(330, 0, 890, 0); bg.addColorStop(0, P.text[0]); bg.addColorStop(1, P.text[1]); x.fillStyle = bg; roundRect(x, 330, y - 8, Math.max(16, 560 * c.pct / 100), 16, 8); x.fill(); }
    x.fillStyle = "rgba(255,255,255,.7)"; x.font = F(700, 34); x.textAlign = "right"; x.fillText(Math.round(c.pct) + "%", W - 80, y + 12); x.textAlign = "left";
    y += 74;
  }
  // tiles
  const visits = Object.values(S.countries).reduce((s, c) => s + (c.visits?.length || 0), 0);
  const tiles = [[w.v, t("sh.c")], [allDays(), t("sh.d")], [visits, t("sh.v")]];
  tiles.forEach(([n, l], i) => {
    const tx = 80 + i * 316, ty = 1660;
    x.fillStyle = "rgba(255,255,255,.07)"; roundRect(x, tx, ty, 288, 170, 36); x.fill();
    x.strokeStyle = "rgba(255,255,255,.08)"; x.lineWidth = 2; x.stroke();
    x.fillStyle = "#fff"; x.font = F(800, 70); x.fillText(fmtNum(n), tx + 30, ty + 92);
    x.fillStyle = "rgba(255,255,255,.65)"; x.font = F(700, 28); x.fillText(l.toUpperCase(), tx + 30, ty + 138);
  });
  return cv;
}
function roundRect(x, a, b, w, h, r) {
  x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r);
  x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath();
}
async function openShare() {
  const cv = await drawShare();

/** Expenses as a spreadsheet: ";" and the local decimal comma, as Excel expects in Europe. */
function exportCsv(trips) {
  const num = n => String(Math.round(n * 1e4) / 1e4).replace(".", decSep());
  const cell = v => { v = String(v ?? ""); return /[";\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const curs = [...new Set(trips.map(tr => tr.cur))];
  const rows = [t("csv.head", { cur: curs.length === 1 ? curs[0] : "" }).replace(/ \(\)/g, "").split("|")];
  for (const tr of [...trips].sort((a, b) => (a.from || "").localeCompare(b.from || ""))) {
    for (const e of tripExp(tr.id).sort((a, b) => a.date.localeCompare(b.date) || (a.t || 0) - (b.t || 0))) {
      rows.push([tr.name, e.date, cname(e.country), t("cat." + e.cat), e.note, num(e.amount), e.currency, num(e.rate || 0),
        num(e.homeAmount) + (curs.length > 1 ? " " + tr.cur : ""), num(myShare(e)) + (curs.length > 1 ? " " + tr.cur : ""),
        e.pay ? t(e.pay === "cash" ? "e.cash" : "e.card") : "", e.personal ? t("b.yesNo") : "",
        e.paidBy || e.split ? personName(tr, e.paidBy) : "", e.split ? e.split.map(id => personName(tr, id)).join(", ") : ""]);
    }
  }
  const text = "\ufeff" + rows.map(r => r.map(cell).join(";")).join("\r\n");
  const name = `globetint-${trips.length === 1 ? plain(trips[0].name).replace(/ /g, "-") || "trip" : "expenses"}-${today()}.csv`;
  if (AND?.saveBase64) {
    const bytes = new TextEncoder().encode(text);
    let bin = "";
    for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
    AND.saveBase64(name, "text/csv", btoa(bin));
  } else { download(URL.createObjectURL(new Blob([text], { type: "text/csv" })), name); toast(t("x.csvSaved")); }
}

  editExpense: v => openExpense(v),
  pickHere: () => { const tr = tripById(S.settings.currentTrip); if (tr) openList(code => setTripCountry(tr, code), t("t.pick")); },
  gpsSwitch: () => { const tr = tripById(S.settings.currentTrip); if (tr && gpsSuggest) setTripCountry(tr, gpsSuggest); },
  share: () => openShare(),
  exportData: () => exportData(),
  timeline: () => openTimeline(),
  compare: () => openCompare(),
  openCash: () => { const tr = tripById(viewTripId) || tripById(S.settings.currentTrip); if (tr) openCash(tr); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el.dataset.v, el);
});

function applyLang() {
  LANG = S.settings.lang === "auto" ? detectLang() : S.settings.lang;
  setLocale();
}
function rerenderAll() {
  renderNav(); renderChips(); MAP.colorize();
  if (curTab === "map") renderMapPanel();
  if (curTab === "trip") renderTrip();
  if (curTab === "stats") renderStats();
  for (const s of stack) s.refresh?.();
  refreshCountrySheets();
}

/* ---------------- Start ---------------- */
(async function start() {
  await DB.open();
  S = normalize(await DB.get("state"));
  applyLang();
  applyTheme();
  MAP = new WorldMap($("#map"));
  renderNav(); renderChips();
  MAP.colorize();
  renderMapPanel();
  MAP.render();
  try { AND?.ready?.(); } catch (e) {}
  fetchRates(false);
})();
</script>
</body>
</html>
