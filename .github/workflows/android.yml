name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['index.html', 'data/**', 'vendor/**', 'fonts/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'data/**', 'vendor/**', 'fonts/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.

      # Fingerprint of everything bundled in the APK except index.html (Android code, map data,
      # libraries, fonts). The app only offers an APK update when the newest release's fingerprint
      # differs from its own; index.html changes come in through WebUpdater without an APK.
      - name: Fingerprint the native part
        run: echo "NATIVE_HASH=$(git ls-files -s android data vendor fonts | sha1sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../globetint.apk

      - uses: actions/upload-artifact@v4
        with:
          name: globetint-apk
          path: globetint.apk

      # Each build on main becomes a GitHub Release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/globetint.apk
      # The tag must match the app's versionCode (the run number, see android/app/build.gradle):
      # the in-app update check compares the number after the last dot with the installed version.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=${{ github.run_number }}
          gh release create "v1.0.$BUILD" globetint.apk \
            --title "GlobeTint 1.0.$BUILD" \
            --notes "Android build of commit ${{ github.sha }}. Download globetint.apk below and open it on your phone to install or update. native: ${{ env.NATIVE_HASH }}"
